name: Monthly Audit

on:
  schedule:
    - cron: "30 3 5 * *"

  workflow_dispatch:

jobs:
  monthly-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run monthly audit
        run: uv run python main.py
