name: Monthly Audit

on:
  schedule:
    - cron: "0 9 5 * *" # 5th of every month at 09:00 IST
      timezone: "Asia/Kolkata"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Trigger audit
        env:
          AUDIT_API_URL: ${{ secrets.AUDIT_API_URL }}
          AUDIT_API_KEY: ${{ secrets.AUDIT_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${AUDIT_API_URL}" ]; then
            echo "::error::Secret AUDIT_API_URL is not set."
            exit 1
          fi

          if [ -z "${AUDIT_API_KEY}" ]; then
            echo "::error::Secret AUDIT_API_KEY is not set."
            exit 1
          fi

          AUDIT_API_URL="${AUDIT_API_URL%/}"
          AUDIT_ENDPOINT="${AUDIT_API_URL}/api/v1/audit/runs"

          http_code=$(curl -sS \
            -o /tmp/response.json \
            -w "%{http_code}" \
            -X POST "${AUDIT_ENDPOINT}" \
            -H "X-Api-Key: ${AUDIT_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' || true)

          echo "Requested: POST ${AUDIT_ENDPOINT}"
          cat /tmp/response.json 2>/dev/null || echo "(no response body)"

          if [ "${http_code}" != "202" ]; then
            echo "::error::Failed to start audit. HTTP ${http_code}."
            exit 1
          fi

          echo "Audit triggered successfully."

          run_id=$(jq -r '.run_id' /tmp/response.json)
          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "::error::Audit API did not return a run ID."
            exit 1
          fi

          echo "Waiting for audit run ${run_id} to finish."
          poll_interval_seconds=600
          echo "Checking status every 10 minutes to keep the Render Free service active."
          while true; do
            sleep "${poll_interval_seconds}"
            status_code=$(curl -sS \
              -o /tmp/status.json \
              -w "%{http_code}" \
              "${AUDIT_ENDPOINT}/${run_id}" \
              -H "X-Api-Key: ${AUDIT_API_KEY}" || true)

            if [ "${status_code}" != "200" ]; then
              cat /tmp/status.json 2>/dev/null || true
              echo "::error::Could not read audit status (HTTP ${status_code})."
              exit 1
            fi

            run_status=$(jq -r '.status' /tmp/status.json)
            echo "Audit status: ${run_status}"
            case "${run_status}" in
              completed)
                echo "Audit run ${run_id} completed successfully."
                exit 0
                ;;
              completed_with_failures)
                echo "::error::Audit completed with $(jq -r '.failures' /tmp/status.json) failure(s)."
                exit 1
                ;;
              failed)
                echo "::error::Audit failed: $(jq -r '.error' /tmp/status.json)"
                exit 1
                ;;
              running) ;;
              *)
                echo "::error::Unexpected audit status: ${run_status}"
                exit 1
                ;;
            esac
          done
