name: Monthly Audit

on:
  schedule:
    - cron: "30 3 5 * *" # 5th of every month at 09:00 IST

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Trigger audit
        env:
          AUDIT_API_URL: ${{ secrets.AUDIT_API_URL }}
          AUDIT_API_KEY: ${{ secrets.AUDIT_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${AUDIT_API_URL}" ]; then
            echo "::error::Secret AUDIT_API_URL is not set."
            exit 1
          fi

          if [ -z "${AUDIT_API_KEY}" ]; then
            echo "::error::Secret AUDIT_API_KEY is not set."
            exit 1
          fi

          AUDIT_API_URL="${AUDIT_API_URL%/}"
          AUDIT_ENDPOINT="${AUDIT_API_URL}/api/v1/audit/runs"

          http_code=$(curl -sS \
            -o /tmp/response.json \
            -w "%{http_code}" \
            -X POST "${AUDIT_ENDPOINT}" \
            -H "X-Api-Key: ${AUDIT_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' || true)

          echo "Requested: POST ${AUDIT_ENDPOINT}"
          cat /tmp/response.json 2>/dev/null || echo "(no response body)"

          if [ "${http_code}" != "202" ]; then
            echo "::error::Failed to start audit. HTTP ${http_code}."
            exit 1
          fi

          echo "Audit triggered successfully."
